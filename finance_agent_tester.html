<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Finance Agent Tester</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  textarea { width: 100%; height: 80px; font-size: 15px; padding: 8px; box-sizing: border-box; }
  button { margin-top: 10px; padding: 10px 20px; font-size: 15px; cursor: pointer; }
  pre { background: #f4f4f4; padding: 12px; white-space: pre-wrap; word-wrap: break-word; border-radius: 6px; }
  label { font-weight: bold; display: block; margin-bottom: 6px; }
</style>
</head>
<body>
  <h2>Finance Agent Tester</h2>
  <label for="url">Render URL (base, no trailing slash):</label>
  <input id="url" type="text" style="width:100%; padding:8px; font-size:15px; box-sizing:border-box;" value="https://finance-agent-a0yc.onrender.com">

  <label for="msg" style="margin-top:16px;">Question:</label>
  <textarea id="msg">I want to take a loan of 500000 at 9% interest for 24 months. What will my monthly EMI be?</textarea>

  <button onclick="send()">Send</button>

  <h3>Response:</h3>
  <pre id="out">(nothing yet)</pre>

<script>
async function send() {
  const base = document.getElementById('url').value.replace(/\/$/, '');
  const msg = document.getElementById('msg').value;
  const out = document.getElementById('out');
  out.textContent = 'Sending...';
  try {
    const res = await fetch(base + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ input: msg })
    });
    const text = await res.text();
    out.textContent = 'Status: ' + res.status + '\n\n' + text;
  } catch (err) {
    out.textContent = 'Error: ' + err.message;
  }
}
</script>
</body>
</html>
